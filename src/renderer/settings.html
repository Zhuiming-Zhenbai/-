<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>小白翻译 · 设置</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>小白翻译 · 设置</h1>
      <p class="hint" id="hint" hidden>⚠️ 请先填写 DeepSeek API Key，否则无法翻译。</p>

      <label class="field">
        <span>DeepSeek API Key</span>
        <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
      </label>

      <div class="field">
        <span>全局快捷键</span>
        <div class="hotkey-row">
          <input id="hotkey" type="text" readonly placeholder="Alt+Q" />
          <button id="change-hotkey" class="ghost" type="button">更改</button>
          <button id="reset-hotkey" class="ghost" type="button">重置</button>
        </div>
        <p class="tip">点击「更改」后按下组合键，确认后立即生效；「重置」恢复默认。</p>
      </div>

      <div class="field">
        <span>点击关闭窗口时</span>
        <label class="radio">
          <input type="radio" name="closeToTray" value="tray" checked />
          <span>后台运行（最小化到托盘）</span>
        </label>
        <label class="radio">
          <input type="radio" name="closeToTray" value="quit" />
          <span>退出程序</span>
        </label>
      </div>

      <p class="tip">
        快捷键默认 Alt+Q，可在上方自定义。
      </p>

      <div class="actions">
        <button id="save" class="primary">保存</button>
        <button id="cancel" class="ghost">取消</button>
      </div>

      <p id="status" class="status"></p>
    </div>
    <script src="settings.js"></script>
  </body>
</html>
