<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>小白翻译 · 设置</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>小白翻译 · 设置</h1>

      <div class="field">
        <span>翻译引擎</span>
        <div class="engine-switch">
          <label class="radio">
            <input type="radio" name="engineMode" value="online" />
            <span>在线 API</span>
          </label>
          <label class="radio">
            <input type="radio" name="engineMode" value="offline" />
            <span>离线翻译（英文/日文 → 中文）</span>
          </label>
        </div>
      </div>

      <div id="online-section" class="section">
        <div class="field">
          <span>API 配置</span>
          <div class="provider-row">
            <select id="provider-select"></select>
            <button id="set-active" class="ghost" type="button">设为当前</button>
            <button id="add-provider" class="ghost" type="button">新增</button>
            <button id="del-provider" class="ghost danger" type="button">删除</button>
          </div>
        </div>
        <label class="field"><span>名称</span><input id="p-name" type="text" placeholder="DeepSeek" /></label>
        <label class="field"><span>Base URL</span><input id="p-baseurl" type="text" placeholder="https://api.deepseek.com" /></label>
        <label class="field"><span>API Key</span><input id="p-apikey" type="password" placeholder="sk-..." autocomplete="off" /></label>
        <label class="field"><span>模型</span><input id="p-model" type="text" placeholder="deepseek-chat" /></label>
        <label class="field"><span>系统提示词</span><textarea id="p-prompt" rows="2"></textarea></label>
        <label class="radio">
          <input type="checkbox" id="p-enabled" checked />
          <span>启用此配置</span>
        </label>
        <p class="tip">当前使用：<span id="active-name">（无）</span></p>
      </div>

      <div id="offline-section" class="section">
        <div class="field">
          <span>源语言</span>
          <select id="off-source">
            <option value="auto">自动检测</option>
            <option value="en">英文</option>
            <option value="ja">日文</option>
          </select>
        </div>
        <label class="field"><span>模型镜像地址</span><input id="off-host" type="text" placeholder="https://hf-mirror.com/" /></label>
        <p class="tip">离线翻译质量受小模型限制，长难句不如 DeepSeek 等大模型，属正常现象，推荐把短文拆分后分别翻译。</p>
        <p class="tip">首次使用需联网下载模型（约数百 MB），之后纯离线。国内建议用 hf-mirror.com 镜像。</p>
      </div>

      <div class="field">
        <span>选中翻译快捷键</span>
        <div class="hotkey-row">
          <input id="hotkey" type="text" readonly placeholder="Alt+Q" />
          <button id="change-hotkey" class="ghost" type="button">更改</button>
          <button id="reset-hotkey" class="ghost" type="button">重置</button>
        </div>
        <p class="tip">选中文本后按下此快捷键弹出翻译。点击「更改」后按组合键，确认后生效；「重置」恢复默认。</p>
      </div>

      <div class="field">
        <span>屏幕识别快捷键</span>
        <div class="hotkey-row">
          <input id="ocr-hotkey" type="text" readonly placeholder="Alt+W" />
          <button id="change-ocr" class="ghost" type="button">更改</button>
          <button id="reset-ocr" class="ghost" type="button">重置</button>
        </div>
        <p class="tip">按下此快捷键打开/聚焦屏幕识别窗口。</p>
      </div>

      <div class="field">
        <span>点击关闭窗口时</span>
        <label class="radio">
          <input type="radio" name="closeToTray" value="tray" checked />
          <span>后台运行（最小化到托盘）</span>
        </label>
        <label class="radio">
          <input type="radio" name="closeToTray" value="quit" />
          <span>退出程序</span>
        </label>
      </div>

      <div class="actions">
        <button id="save" class="primary">保存</button>
        <button id="cancel" class="ghost">取消</button>
      </div>
      <p id="status" class="status"></p>
    </div>
    <script src="settings.js"></script>
  </body>
</html>
